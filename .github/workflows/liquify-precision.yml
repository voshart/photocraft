name: Experimental Liquify validation

on:
  push:
    branches: ['liquify/precision-*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: liquify-validation-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: never
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  RUST_BACKTRACE: 1

jobs:
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Linux UI prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libwayland-dev libx11-dev libxrandr-dev libxi-dev \
            libgl1-mesa-dev libgtk-3-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          key: precision-pass4-validation
          cache-on-failure: true
      - name: Run and record all Rust gates
        run: >-
          python3 tools/liquify-validation/runner.py .
          --output validation --format-touched
      - name: Retain gate logs and exact tested worktree diff
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: liquify-validation-${{ github.sha }}
          path: validation/
          if-no-files-found: warn
          retention-days: 14
      - name: Retain executable only after all gates pass
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: photocraft-experimental-linux-${{ github.sha }}
          path: target/debug/photocraft
          if-no-files-found: error
          retention-days: 14

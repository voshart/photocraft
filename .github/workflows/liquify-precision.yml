name: Personal Windows Liquify build

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: liquify-validation-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: never
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_INCREMENTAL: '0'
  CARGO_BUILD_JOBS: '2'
  RUST_BACKTRACE: 1

jobs:
  rust:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          key: precision-pass4-windows
          cache-on-failure: true
      - name: Check native Liquify
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          cargo fmt --all -- --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked --jobs 2 -p photocraft-algo --lib liquify
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked --jobs 2 -p photocraft-ui-egui --lib liquify
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked --jobs 2 -p photocraft-engine --lib distort
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked --jobs 2 -p photocraft-ml --lib
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo clippy --locked --jobs 2 -p photocraft-algo -p photocraft-ui-egui -p photocraft-engine -p photocraft-ml --all-targets -- -D warnings
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo xtask layers
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked --jobs 2 -p photocraft-engine --test panic_hunt -- --ignored
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build personal Windows app
        shell: pwsh
        run: ./scripts/build-windows-personal.ps1
      - name: Retain Windows executable
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: photocraft-experimental-windows-${{ github.sha }}
          path: dist/windows/
          if-no-files-found: error
          retention-days: 14
